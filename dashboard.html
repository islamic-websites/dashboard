<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albaseerah Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://js.puter.com/v2/"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-card glass">
      <img src="./image/flogo.png" alt="Albaseerah" class="login-logo">
      <h1>Welcome Back</h1>
      <p class="login-sub">Sign in to your account</p>
      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" required autocomplete="current-password">
            <button type="button" id="toggle-password" class="eye-btn">👁️</button>
          </div>
        </div>
        <div class="remember-group">
          <input type="checkbox" id="remember-me">
          <label for="remember-me">Remember me</label>
        </div>
        <button type="submit" class="btn-primary magnetic">Sign In</button>
        <p id="login-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div id="data-banner" class="data-banner hidden">Data updated in Google Sheets. <button id="refresh-data">Refresh</button></div>
    <header class="topbar glass">
      <div class="topbar-left">
        <img src="./image/logo.png" alt="Icon" class="topbar-logo">
        <h2>Albaseerah</h2>
      </div>
      <div class="topbar-right">
        <button id="cmd-trigger" class="btn-icon">⌘K</button>
        <button id="settings-btn" class="btn-icon">⚙️</button>
        <button id="logout-btn" class="btn-icon">🚪</button>
      </div>
    </header>
    <div class="main-layout">
      <aside class="sidebar glass">
        <nav id="sidebar-nav">
          <div class="dropdown" id="dashboard-dropdown">
            <div class="nav-item" id="dashboard-toggle">Dashboard ▼</div>
            <div class="dropdown-menu">
              <div class="dropdown-item" data-view="overview">Overview</div>
              <div class="dropdown-item" data-view="period1">Period 1</div>
              <div class="dropdown-item" data-view="period2">Period 2</div>
              <div class="dropdown-item" data-view="period3">Period 3</div>
              <div class="dropdown-item" data-view="period4">Period 4</div>
              <div class="dropdown-item" data-view="period5">Period 5</div>
              <div class="dropdown-item" data-view="period6">Period 6</div>
              <div class="dropdown-item" data-view="period7">Period 7</div>
              <div class="dropdown-item" data-view="period8">Period 8</div>
              <div class="dropdown-item" data-view="period9">Period 9</div>
            </div>
          </div>
          <div class="nav-item" data-view="students">Students</div>
          <div class="nav-item" data-view="staff">Staff</div>
          <div class="nav-item" data-view="records">Records</div>
          <div class="nav-item" data-view="messages">Messages</div>
          <div class="nav-item" data-view="helpdesk">Help Desk</div>
          <div class="nav-item" data-view="info">Info Grid</div>
        </nav>
      </aside>
      <main id="main-content" class="main-content">
        <div id="view-container"></div>
      </main>
    </div>
    
    <div id="chat-fab" class="chat-fab">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>
    <div id="chat-window" class="chat-window glass hidden">
      <div class="chat-header">
        <h3>Nova AI</h3>
        <button id="close-chat" class="btn-icon">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ask Nova...">
        <button id="send-chat" class="btn-primary">Send</button>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <div id="modal-container" class="modal-container hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content glass">
        <div id="modal-body"></div>
      </div>
    </div>
    <div id="command-palette" class="command-palette hidden">
      <div class="cmd-overlay"></div>
      <div class="cmd-box glass">
        <input type="text" id="cmd-input" placeholder="Search commands...">
        <div id="cmd-results" class="cmd-results"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
