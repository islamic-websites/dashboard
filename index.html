<!DOCTYPE html>
<html lang="en" data-accent="maroon" data-radius="rounded" data-motion="full" data-pattern="off">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard</title>
<link rel="icon" type="image/png" href="https://albaseerah.org/wp-content/uploads/2025/08/AAE-Emb-Clr.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="updateBanner" class="update-banner" hidden>
  <i class="fa-solid fa-arrows-rotate"></i>
  <span>Data has been updated in Google Sheets.</span>
  <button type="button" onclick="location.reload()">Refresh</button>
</div>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo"><img src="https://albaseerah.org/wp-content/uploads/2025/06/8ba166cb-68df-49f3-bbf8-ed51a57e03b6.png" alt="Albaseerah International Institute"></div>
  <div class="loading-bar"><i></i></div>
</div>

<div class="mesh" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="pattern" aria-hidden="true"></div>

<aside class="sidebar">
  <div class="brand">
    <img src="https://albaseerah.org/wp-content/uploads/2025/06/8ba166cb-68df-49f3-bbf8-ed51a57e03b6.png" alt="Albaseerah International Institute">
  </div>
  <nav class="nav">
    <button class="nav-item active" id="navHome" type="button">
      <svg class="nav-svg" viewBox="0 0 24 24"><path pathLength="60" d="M3 11 L12 3 L21 11"/><path pathLength="60" d="M5 10 V21 H19 V10"/><path pathLength="60" d="M10 21 V14 H14 V21"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" id="navDash" type="button">
      <svg class="nav-svg" viewBox="0 0 24 24"><path pathLength="60" d="M21 12 A9 9 0 1 1 12 3"/><path pathLength="60" d="M12 12 V3 A9 9 0 0 1 21 12 Z"/></svg>
      <span>Dashboards</span>
    </button>
    <button class="nav-item" id="navGrades" type="button">
      <svg class="nav-svg" viewBox="0 0 24 24"><path pathLength="60" d="M2 9 L12 4 L22 9 L12 14 Z"/><path pathLength="60" d="M6 11.5 V16 C6 17.5 9 19 12 19 C15 19 18 17.5 18 16 V11.5"/><path pathLength="60" d="M22 9 V15"/></svg>
      <span>Grades</span>
      <i class="fa-solid fa-chevron-down drop-icon"></i>
    </button>
    <div class="subnav" id="gradesSubMenu"><div class="subnav-inner" id="subnavList"></div></div>
    <button class="nav-item" id="navSettings" type="button">
      <svg class="nav-svg" viewBox="0 0 24 24"><path pathLength="60" d="M18.5 12 A6.5 6.5 0 1 0 5.5 12 A6.5 6.5 0 1 0 18.5 12"/><path pathLength="60" d="M14.8 12 A2.8 2.8 0 1 0 9.2 12 A2.8 2.8 0 1 0 14.8 12"/><path pathLength="60" d="M12 3 V5.5 M12 18.5 V21 M3 12 H5.5 M18.5 12 H21 M5.6 5.6 L7.4 7.4 M16.6 16.6 L18.4 18.4 M5.6 18.4 L7.4 16.6 M16.6 7.4 L18.4 5.6"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</aside>

<header class="topbar" id="topbar">
  <h1 id="pageTitle">Students</h1>
  <div class="top-right">
    <label class="search" id="topSearch">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search" autocomplete="off">
    </label>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
  </div>
</header>

<div class="smart-bar" id="smartBar"></div>

<button class="edge prev" id="edgePrev" type="button" aria-label="Previous" hidden><i class="fa-solid fa-chevron-left"></i></button>
<button class="edge next" id="edgeNext" type="button" aria-label="Next" hidden><i class="fa-solid fa-chevron-right"></i></button>

<div class="main">
  <main class="page">
    <section id="listView">
      <div class="intro"><h2>Students</h2></div>
      <div class="filter-bar" id="homeFilter">
        <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="homeSearch" placeholder="Search name, email or grade" autocomplete="off"></label>
        <select id="homeGrade"></select>
        <select id="homeHifz">
          <option value="all">All Students</option>
          <option value="yes">Enrolled in Hifz</option>
          <option value="no">Not in Hifz</option>
        </select>
        <span class="fb-sep"></span>
        <select id="homeSort">
          <option value="name">Sort: Last Name (A-Z)</option>
          <option value="grade">Sort: Grade Level (Low to High)</option>
          <option value="id">Sort: Student ID</option>
        </select>
      </div>
      <div class="student-grid" id="studentGrid">
        <div class="empty-state"><div class="spinner"></div></div>
      </div>
    </section>
    <section id="profileView" hidden></section>
    <section id="gradesView" hidden></section>
    <section id="gradesDirView" hidden></section>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
    <button class="modal-close" id="settingsClose" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <nav class="modal-nav">
      <button class="tab active" type="button" data-tab="general"><i class="fa-solid fa-sliders"></i><span>General</span></button>
      <button class="tab" type="button" data-tab="appearance"><i class="fa-solid fa-palette"></i><span>Appearance</span></button>
      <button class="tab" type="button" data-tab="advanced"><i class="fa-solid fa-database"></i><span>Advanced</span></button>
    </nav>
    <div class="modal-body">
      <div class="panel active" id="panel-general">
        <h3>General</h3>
        <div class="field">
          <label for="gradeFormat">Grade format</label>
          <select id="gradeFormat">
            <option value="fraction">Fraction</option>
            <option value="percentage">Percentage</option>
            <option value="letter">Letter</option>
          </select>
        </div>
        <div class="field">
          <label for="viewMode">View mode</label>
          <select id="viewMode">
            <option value="grid">Grid</option>
            <option value="list">List</option>
          </select>
        </div>
        <div class="field">
          <label for="densityRange">Density</label>
          <div class="range-row"><span>Dense</span><input type="range" id="densityRange" min="0" max="100" step="1"><span>Comfortable</span></div>
        </div>
        <div class="field inline">
          <label for="contactsToggle">Show guardian contacts</label>
          <label class="switch"><input type="checkbox" id="contactsToggle"><span class="slider"></span></label>
        </div>
        <div class="field inline">
          <label for="attendanceToggle">Show attendance chart</label>
          <label class="switch"><input type="checkbox" id="attendanceToggle"><span class="slider"></span></label>
        </div>
      </div>
      <div class="panel" id="panel-appearance">
        <h3>Appearance</h3>
        <div class="field inline">
          <label for="darkToggle">Dark mode</label>
          <label class="switch"><input type="checkbox" id="darkToggle"><span class="slider"></span></label>
        </div>
        <div class="field inline">
          <label for="systemToggle">Follow system theme</label>
          <label class="switch"><input type="checkbox" id="systemToggle"><span class="slider"></span></label>
        </div>
        <div class="field">
          <label for="accentSelect">Accent color</label>
          <select id="accentSelect">
            <option value="maroon">Maroon</option>
            <option value="gold">Gold</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
          </select>
        </div>
        <div class="field">
          <label for="radiusSelect">Corner radius</label>
          <select id="radiusSelect">
            <option value="sharp">Sharp</option>
            <option value="rounded">Rounded</option>
            <option value="pill">Pill</option>
          </select>
        </div>
        <div class="field">
          <label for="fontSelect">Font size</label>
          <select id="fontSelect">
            <option value="small">Small</option>
            <option value="default">Default</option>
            <option value="large">Large</option>
          </select>
        </div>
        <div class="field">
          <label for="fontFamilySelect">Font</label>
          <select id="fontFamilySelect">
            <option value="DM Sans">DM Sans</option>
            <option value="Inter">Inter</option>
            <option value="Lora">Lora</option>
            <option value="Roboto">Roboto</option>
          </select>
        </div>
        <div class="field inline">
          <label for="patternToggle">Background pattern</label>
          <label class="switch"><input type="checkbox" id="patternToggle"><span class="slider"></span></label>
        </div>
        <div class="field inline">
          <label for="motionToggle">Reduce motion</label>
          <label class="switch"><input type="checkbox" id="motionToggle"><span class="slider"></span></label>
        </div>
      </div>
      <div class="panel" id="panel-advanced">
        <h3>Advanced</h3>
        <div class="import-card">
          <h4><i class="fa-solid fa-table"></i> Google Sheet</h4>
          <div class="field"><label for="sheetLink">Google Sheet Link</label><input class="text-input" type="text" id="sheetLink" placeholder="https://docs.google.com/spreadsheets/d/..." autocomplete="off"></div>
          <div class="import-buttons"><button class="btn" type="button" id="connectBtn"><i class="fa-solid fa-plug"></i> Connect</button></div>
        </div>
        <div class="import-card gap-top">
          <h4><i class="fa-solid fa-file-excel"></i> Excel workbook</h4>
          <div class="import-buttons"><button class="btn ghost" type="button" id="xlsxBtn"><i class="fa-solid fa-file-import"></i> Import .xlsx</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="palette-overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette-input">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="paletteInput" placeholder="Search" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-results" id="paletteResults"></div>
  </div>
</div>

<div class="overlay" id="shortcuts" hidden>
  <div class="kb-modal" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <button class="modal-close" id="shortcutsClose" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <h3>Keyboard shortcuts</h3>
    <div class="kb-row"><span>Open search</span><span class="kb-keys"><kbd>\</kbd></span></div>
    <div class="kb-row"><span>Search people</span><span class="kb-keys"><kbd>@</kbd><span>then a name</span></span></div>
    <div class="kb-row"><span>Search settings</span><span class="kb-keys"><kbd>?</kbd><span>then a setting</span></span></div>
    <div class="kb-row"><span>Previous or next</span><span class="kb-keys"><kbd><i class="fa-solid fa-arrow-left"></i></kbd><kbd><i class="fa-solid fa-arrow-right"></i></kbd></span></div>
    <div class="kb-row"><span>Move through results</span><span class="kb-keys"><kbd><i class="fa-solid fa-arrow-up"></i></kbd><kbd><i class="fa-solid fa-arrow-down"></i></kbd></span></div>
    <div class="kb-row"><span>Open result</span><span class="kb-keys"><kbd>Enter</kbd></span></div>
    <div class="kb-row"><span>Close</span><span class="kb-keys"><kbd>Esc</kbd></span></div>
  </div>
</div>

<div class="fab" id="fab" hidden>
  <div class="fab-menu">
    <button type="button" class="fab-action" id="fabEmail"><i class="fa-regular fa-envelope"></i><span>Email</span></button>
    <button type="button" class="fab-action" id="fabCall"><i class="fa-solid fa-phone"></i><span>Call</span></button>
    <button type="button" class="fab-action" id="fabCopy"><i class="fa-regular fa-copy"></i><span>Copy ID</span></button>
  </div>
  <button type="button" class="fab-main" id="fabMain" aria-label="Quick actions"><i class="fa-solid fa-plus"></i></button>
</div>

<button type="button" class="help-btn" id="helpBtn" aria-label="Keyboard shortcuts"><i class="fa-solid fa-question"></i></button>

<input type="file" id="xlsxInput" accept=".xlsx,.xls" hidden>

<div class="toast" id="toast"></div>
<div class="chart-tooltip" id="chartTooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="script.js"></script>
</body>
</html>
